<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{description}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <title>{{title}}</title>
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" type="image/png" href="{{base}}images/brand/favicon.png?v={{assetVersion}}">
  <link rel="stylesheet" href="{{base}}styles.css?v={{assetVersion}}">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sayaç Kapak · PanoMetal54">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{shareImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sayaç Kapak · PanoMetal54, Sakarya">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">{{schema}}</script>
  <script defer src="{{base}}main.js?v={{assetVersion}}"></script>
</head>

<body>
<a class="skip-link" href="#main">İçeriğe geç</a>
{{header}}
<main id="main">{{content}}</main>
{{footer}}
<div class="mobile-contact" aria-label="Hızlı iletişim"><a href="tel:{{phone}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a15 15 0 0 1-7-7l2-2-2-5Z"/></svg>Hemen ara</a><a href="{{waUrl}}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.8 7.4L3 20.5l1.4-4.6A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="m8 7 1.5 2.5-1 1a8 8 0 0 0 4.5 4.5l1-1L16.5 15c-1 3-6 0-8-2s-4-5-.5-6Z"/></svg>WhatsApp’tan yaz</a></div>
<dialog class="photo-dialog" id="photo-dialog" aria-label="Uygulama fotoğrafı"><button type="button" class="photo-close" aria-label="Fotoğrafı kapat">×</button><img id="enlarged-photo" src="{{base}}images/projects/case-burgundy-after.jpg" alt=""><p id="photo-caption"></p></dialog>
</body></html>
